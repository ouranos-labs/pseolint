name: Release Action

on:
  push:
    tags:
      - "v*"

jobs:
  build-action:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install
      - name: Build core
        run: cd packages/core && bun run build
      - name: Build action
        run: cd packages/action && bun run build:ncc
      - name: Deploy to action-v1 branch
        env:
          # Pass github context through an env var rather than interpolating
          # ${{ github.ref_name }} directly into the run script: ref names are
          # attacker-influenceable and inlining them enables shell injection
          # (CWE-78). The shell reads the value, never the workflow templater.
          REF_NAME: ${{ github.ref_name }}
        run: |
          cd packages/action
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan action-v1-tmp
          git reset
          git add action.yml dist/
          git commit -m "Release action $REF_NAME"
          git push origin action-v1-tmp:action-v1 --force
