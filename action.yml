# GitHub Actions Marketplace requires the action metadata file at the ROOT of
# the repository: "Each repository must contain a single action metadata file
# (action.yml or action.yaml) at the root", and "Repositories may include other
# actions metadata files in sub-folders, but they will not be automatically
# listed in the marketplace."
# https://docs.github.com/en/actions/creating-actions/publishing-actions-in-github-marketplace
#
# packages/action/action.yml therefore cannot be listed, however correct it is.
# This file is the marketplace-facing copy; it is the same action, differing
# only in `runs.main`, which is repo-relative here and package-relative there
# (the action-release workflow publishes that one to the `action-v1` orphan
# branch, whose root IS packages/action). action-metadata-parity.test.ts keeps
# the two from drifting.
name: "pSEO Lint"
description: "Run pseolint against your generated site output and post results on PRs."
author: "Ouranos Labs"

branding:
  icon: "check-circle"
  color: "green"

inputs:
  source:
    description: "Build output directory or sitemap URL"
    required: true
  threshold:
    description: "Score threshold for check failure (default: 40)"
    required: false
    default: "40"
  token:
    description: "GitHub token for PR comments (defaults to github.token)"
    required: false
    default: ${{ github.token }}
  fail-on-truncated:
    description: "Fail the check when the audit was truncated (partial coverage) even if risk is under threshold. Default false (warn only)."
    required: false
    default: "false"

outputs:
  score:
    description: "Risk score (0-100, lower is better). Alias of `risk`, kept for backwards compatibility."
  risk:
    description: "Risk score (0-100, lower is better)."
  verdict:
    description: "Overall verdict: ready | caution | concerning | critical."
  pageCount:
    description: "Number of pages analysed."
  truncated:
    description: "\"true\" when the crawl aborted mid-flight (e.g. backpressure watchdog on a degraded origin) and coverage is partial; otherwise \"false\". When true, verdict/risk/counts are lower bounds."
  truncated-reason:
    description: "Human-readable reason the crawl was truncated. Empty string when not truncated."

runs:
  using: "node24"
  main: "packages/action/dist/index.js"
