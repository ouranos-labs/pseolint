name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.13"
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
      - name: Publish with Changesets
        run: bun run release
