name: Release

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install

      # Build and test ONLY the npm-publishable packages. The private workspaces
      # (@pseolint/web, @pseolint/action) are deployed through other pipelines
      # (Vercel, GitHub Actions marketplace) and must not gate the npm release —
      # in particular @pseolint/web pulls in Next.js typings that can break a
      # release on an unrelated upstream change.
      - name: Build publishable packages
        run: bun run build --filter='@pseolint/core' --filter='pseolint' --filter='@pseolint/mcp'

      - name: Test publishable packages
        run: bun run test --filter='@pseolint/core' --filter='pseolint' --filter='@pseolint/mcp'

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: bun run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
