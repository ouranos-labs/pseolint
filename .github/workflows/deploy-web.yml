name: Deploy web

# Builds apps/web into an image on GHCR, then tells Coolify to pull and roll it.
# Setup (once):
#   secrets.COOLIFY_WEBHOOK  Coolify → the app → Webhooks → "Deploy Webhook" URL
#   secrets.COOLIFY_TOKEN    Coolify → Keys & Tokens → API token with "deploy" permission
#   vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY (and optionally NEXT_PUBLIC_SITE_URL,
#   NEXT_PUBLIC_GOOGLE_INDEXING_ENABLED): inlined at build time, so they are build args.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://pseolint.dev' }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_GOOGLE_INDEXING_ENABLED=${{ vars.NEXT_PUBLIC_GOOGLE_INDEXING_ENABLED }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Coolify deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          code=$(curl -sS --retry 3 -o resp.txt -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK")
          # Path with long ids redacted, so a wrong webhook URL is diagnosable from the log.
          echo "Coolify $code on $(echo "$COOLIFY_WEBHOOK" | sed -E 's#^https?://[^/]+##; s/[0-9a-zA-Z]{16,}/<id>/g'): $(head -c 500 resp.txt)"
          [ "${code:0:1}" = 2 ]
