name: Dogfood, audit pseolint.dev

# We hold pseolint.dev to its own linter. This runs the published Action
# against production on a daily schedule, after every merge that touches the
# web app, and on demand. It fails if the SpamBrain Risk Score crosses the
# threshold: so an SEO regression on our own site can't ship silently.
#
# fail-on-truncated is intentionally OFF here: production is serverless, so a
# polite crawl trips pseolint's own backpressure watchdog on cold-start latency
# (p95 spikes vs the warmup baseline) and truncates with a healthy verdict
# (e.g. risk 28/100, well under 40). That's an origin-perf flake, not an SEO
# regression: failing on it just produces a daily red that trains us to ignore
# the dogfood. The risk threshold still gates what was crawled; the truncated
# verdict is a documented lower bound, so a real regression still trips the 40.
#
# To gate a PR against its *preview* deploy instead of production, add a
# `pull_request` trigger plus a step that resolves the Vercel preview URL
# (wait for the deployment, read its URL) and pass that as `source` below.

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC
  push:
    branches: [main]
    paths:
      - "apps/web/**"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit pseolint.dev with pseolint
        uses: ouranos-labs/pseolint/packages/action@action-v1
        with:
          source: https://pseolint.dev/sitemap.xml
          threshold: 40
          fail-on-truncated: "false"
