<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 240px; margin: 0; padding: 14px; }
      h1 { font-size: 13px; margin: 0 0 4px; }
      .sub { color: #666; margin: 0 0 10px; }
      button { cursor: pointer; font: 13px system-ui, sans-serif; background: #1a1a1a;
        color: #fff; border: 0; padding: 8px 12px; border-radius: 8px; width: 100%; }
      button:disabled { opacity: 0.6; cursor: default; }
      #status { color: #555; margin: 8px 0 0; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <h1>pseolint</h1>
    <p class="sub">Badge pSEO risk on the results you're viewing.</p>
    <button id="scan">Scan results</button>
    <p id="status"></p>
    <!-- external only: extension_pages CSP forbids inline scripts (manifest §7) -->
    <script src="dist/popup.js"></script>
  </body>
</html>
